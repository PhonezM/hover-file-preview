name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      # bash, not ./, so a checkout without the exec bit still builds
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hover-file-preview-firefox
          path: hover-file-preview-firefox.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hover-file-preview-chrome
          path: hover-file-preview-chrome.zip
          if-no-files-found: error
      # a v* tag publishes both submission packages on the release page
      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" --clobber hover-file-preview-firefox.zip hover-file-preview-chrome.zip \
            || gh release create "$GITHUB_REF_NAME" hover-file-preview-firefox.zip hover-file-preview-chrome.zip --generate-notes
